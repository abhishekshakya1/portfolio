  <body class="bg-[#030303] text-zinc-100 antialiased selection:bg-accent selection:text-black">
    <div id="root">
      <!-- Instant Zero-JS Branded Obsidian Preloader (Replaced automatically when React mounts) -->
      <div id="preloader" style="position:fixed;inset:0;background:#030303;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:system-ui,-apple-system,sans-serif;">
        <div style="position:relative;width:64px;height:64px;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:0;border-radius:50%;border:2px solid rgba(16,185,129,0.2);animation:pulseRing 1.8s cubic-bezier(0.4,0,0.6,1) infinite;"></div>
          <div style="position:absolute;inset:6px;border-radius:50%;border:2px solid transparent;border-top-color:#10b981;animation:spin 1s linear infinite;"></div>
          <span style="font-weight:700;font-size:18px;color:#ffffff;letter-spacing:-0.5px;">A</span>
        </div>
        <p style="margin-top:18px;color:#71717a;font-size:12px;font-family:monospace;letter-spacing:0.2em;text-transform:uppercase;">Initializing System...</p>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulseRing { 0%,100% { transform: scale(0.9); opacity: 0.3; } 50% { transform: scale(1.15); opacity: 0.8; } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
